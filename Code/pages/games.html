<h1>Games Library</h1>
<div class="games-header">
    <input type="text" id="gameSearch" placeholder="Search games..." class="search-input">
    <button id="addGameBtn" class="primary-button">+ Add Game</button>
</div>

<div id="gamesGrid" class="games-grid">
    <div class="game-card">
        <div class="game-card-image">🎲</div>
        <h3>Sample Game 1</h3>
        <p class="game-info">Players: 2-4 | Time: 60 min</p>
    </div>
    <div class="game-card">
        <div class="game-card-image">🎯</div>
        <h3>Sample Game 2</h3>
        <p class="game-info">Players: 3-6 | Time: 45 min</p>
    </div>
    <div class="game-card">
        <div class="game-card-image">🃏</div>
        <h3>Sample Game 3</h3>
        <p class="game-info">Players: 2-5 | Time: 90 min</p>
    </div>
</div>

<div id="gameDetails" class="game-details" style="display: none;">
    <!-- Game details will be shown here -->
</div>
