<h1>Games Library</h1>
<div class="games-header">
    <input type="text" id="gameSearch" placeholder="Search games..." class="search-input">
    <button id="addGameBtn" class="primary-button">+ Add Game</button>
</div>

<div class="games-filters" id="gamesFilters">
    <span class="games-filters-label">Show:</span>
    <label><input type="checkbox" id="filterOwn">Own</label>
    <label><input type="checkbox" id="filterWantToPlay">Want to Play</label>
    <label><input type="checkbox" id="filterWantToBuy">Want to Buy</label>
    <label><input type="checkbox" id="filterWant">Want</label>
    <label><input type="checkbox" id="filterWishlist">Wishlist</label>
    <label><input type="checkbox" id="filterForTrade">For Trade</label>
    <label><input type="checkbox" id="filterPreOrdered">Preordered</label>
    <label><input type="checkbox" id="filterPrevOwned">Previously Owned</label>
</div>

<div id="gamesGrid" class="games-grid">
    <p style="grid-column: 1/-1; text-align: center; color: #666;">Loading games...</p>
</div>

<div id="gameDetailsOverlay" class="game-details-overlay"></div>
<div id="gameDetails" class="game-details">
    <!-- Game details will be shown here -->
</div>
