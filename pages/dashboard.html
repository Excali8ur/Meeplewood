<h1>Dashboard</h1>
<p>Welcome to Meeplewood - Your board game companion!</p>

<div class="dashboard-stats">
    <div class="stat-card">
        <h3>Total Games</h3>
        <p class="stat-number" id="totalGames">0</p>
    </div>
    <div class="stat-card">
        <h3>Recent Plays</h3>
        <p class="stat-number" id="recentPlays">0</p>
    </div>
    <div class="stat-card">
        <h3>Favorite Game</h3>
        <p class="stat-number" id="favoriteGame">-</p>
    </div>
</div>

<div class="recent-activity">
    <h2>Recent Activity</h2>
    <div id="activityList" class="activity-list">
        <p class="empty-state">No recent activity. Start logging your game plays!</p>
    </div>
</div>
